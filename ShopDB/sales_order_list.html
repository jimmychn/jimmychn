<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷貨單據管理 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .table-v-align td { vertical-align: middle; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-file-invoice-dollar text-primary me-2"></i>銷貨單據列表</h2>
        <a href="sales_order.html" class="btn btn-primary shadow-sm"><i class="fa-solid fa-plus"></i> 新增銷貨單</a>
    </div>

    <!-- 搜尋列 -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchInput" class="form-control" placeholder="輸入單號或客戶名稱搜尋..." onkeyup="loadOrders(1)">
            </div>
        </div>
    </div>

    <!-- 訂單列表 -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-v-align mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>單號 / 日期</th>
                            <th>客戶名稱</th>
                            <th class="text-end">金額</th>
                            <th class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="pageInfo"></span>
                <nav><ul class="pagination pagination-sm mb-0" id="paginationBtns"></ul></nav>
            </div>
        </div>
    </div>
</div>

<script>
    let userRole = 0;

    window.onload = async () => {
        // 先檢查權限
        const res = await fetch('api/check_session.php');
        const session = await res.json();
        userRole = session.user.role_id;
        loadOrders(1);
    };

    async function loadOrders(page = 1) {
        const q = document.getElementById('searchInput').value;
        const res = await fetch(`api/get_orders.php?q=${encodeURIComponent(q)}&page=${page}`);
        const result = await res.json();

        const tbody = document.getElementById('orderTableBody');
        tbody.innerHTML = result.data.map(o => `
            <tr>
                <td>
                    <div class="fw-bold">${o.order_no}</div>
                    <div class="small text-muted">${o.order_date}</div>
                </td>
                <td>${o.customer_name}</td>
                <td class="text-end fw-bold text-danger">$${parseFloat(o.final_amount).toLocaleString()}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-info me-1" title="查看"><i class="fa-solid fa-eye"></i></button>
					<button class="btn btn-sm btn-outline-dark me-1" title="列印" 
						onclick="window.open('print_order.html?no=${o.order_no}&type=sales', '_blank')">
						<i class="fa-solid fa-print"></i>
					</button>
                    ${userRole == 1 ? `<a href="sales_return.html?no=${o.order_no}" class="btn btn-sm btn-outline-danger" title="退貨"><i class="fa-solid fa-arrow-rotate-left"></i></a>` : ''}
					${o.status == 1 ? `
						<button class="btn btn-sm btn-outline-danger" title="作廢" onclick="voidDoc('sales', '${o.order_no}')">
							<i class="fa-solid fa-ban"></i>
						</button>` : 
						'<span class="badge bg-secondary">已作廢</span>'
					}

                </td>
            </tr>
        `).join('');

        renderPagination(result.pagination);
    }

	// 在銷貨單列表的「操作」欄位增加此按鈕
	function printOrder(orderNo) {
		// 開啟新視窗列印
		window.open(`print_order.html?no=${orderNo}&type=sales`, '_blank');
	}

    function renderPagination(pg) {
        document.getElementById('pageInfo').innerText = `共 ${pg.total_rows} 筆`;
        let btns = '';
        for (let i = 1; i <= pg.total_pages; i++) {
            btns += `<li class="page-item ${i === pg.current_page ? 'active' : ''}"><a class="page-link" onclick="loadOrders(${i})">${i}</a></li>`;
        }
        document.getElementById('paginationBtns').innerHTML = btns;
    }
	
	// 銷貨單作廢
	async function voidDoc(type, no) {
		const res = await Swal.fire({
			title: '確定要作廢此單據？',
			text: "作廢後將自動反向沖銷庫存！",
			icon: 'warning',
			showCancelButton: true,
			confirmButtonText: '確定作廢',
			confirmButtonColor: '#d33'
		});
		if (res.isConfirmed) {
			const resp = await fetch('api/void_document.php', {
				method: 'POST',
				body: JSON.stringify({type: type, doc_no: no})
			});
			const result = await resp.json();
			if(result.status === 'success') {
				Swal.fire('成功', result.message, 'success');
				loadOrders(); // 重新整理清單
			}
		}
	}	
</script>
</body>
</html>
