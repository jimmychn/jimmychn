<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門市調撥作業 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { background-color: #f8f9fa; } .card-transfer { border-top: 5px solid #6610f2; }</style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-truck-arrow-right text-purple me-2"></i>庫存調撥作業</h2>
        <button class="btn btn-primary" onclick="saveTransfer()"><i class="fa-solid fa-paper-plane"></i> 執行調撥存檔</button>
    </div>

    <!-- 單頭設定 -->
    <div class="card shadow-sm border-0 mb-4 card-transfer">
        <div class="card-body row g-3">
            <div class="col-md-3">
                <label class="form-label small fw-bold text-danger">從哪家店調出？</label>
                <select id="from_store" class="form-select border-danger" onchange="clearItems()"></select>
            </div>
            <div class="col-md-1 text-center d-none d-md-flex align-items-end mb-2">
                <i class="fa-solid fa-angles-right fa-2x text-muted"></i>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold text-success">調入哪家店？</label>
                <select id="to_store" class="form-select border-success"></select>
            </div>
            <div class="col-md-5">
                <label class="form-label small fw-bold">調撥備註</label>
                <input type="text" id="remark" class="form-control" placeholder="例如：支援台中分店促銷活動">
            </div>
        </div>
    </div>

    <!-- 明細 -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">調撥品項明細</span>
            <button class="btn btn-sm btn-outline-primary" onclick="openProductSelector()">+ 加入產品</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light text-center">
                    <tr>
                        <th class="text-start ps-4">產品名稱</th>
                        <th>來源店庫存</th>
                        <th style="width: 150px;">調撥數量</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="itemBody" class="text-center">
                    <!-- JS 載入 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    window.onload = async () => {
        // 載入門市下拉選單
        const res = await fetch('api/get_system_data.php?type=stores');
        const stores = await res.json();
        const fromS = document.getElementById('from_store');
        const toS = document.getElementById('to_store');
        const options = stores.map(s => `<option value="${s.id}">${s.store_name}</option>`).join('');
        fromS.innerHTML = options;
        toS.innerHTML = options;
    };

    function clearItems() { document.getElementById('itemBody').innerHTML = ''; }

    async function openProductSelector() {
        const fromStoreId = document.getElementById('from_store').value;
        const { value: sku } = await Swal.fire({ title: '搜尋產品', input: 'text' });
        if (sku) {
            // 注意：API 需支援帶入特定 store_id 查詢庫存
            const res = await fetch(`api/get_products.php?q=${sku}&store_filter=${fromStoreId}`);
            const result = await res.json();
            if (result.data.length > 0) addRow(result.data[0]);
        }
    }

    function addRow(p) {
        const tbody = document.getElementById('itemBody');
        const tr = document.createElement('tr');
        tr.dataset.pid = p.id;
        tr.innerHTML = `
            <td class="text-start ps-4"><strong>${p.name}</strong><br><small>${p.sku}</small></td>
            <td class="text-muted">${p.stock_qty}</td>
            <td><input type="number" class="form-control text-center qty" value="1" max="${p.stock_qty}"></td>
            <td><button class="btn btn-link text-danger" onclick="this.closest('tr').remove()"><i class="fa-solid fa-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
    }

    async function saveTransfer() {
        const items = [];
        document.querySelectorAll('#itemBody tr').forEach(row => {
            items.push({ product_id: row.dataset.pid, qty: row.querySelector('.qty').value });
        });

        const payload = {
            from_store_id: document.getElementById('from_store').value,
            to_store_id: document.getElementById('to_store').value,
            transfer_date: new Date().toISOString().split('T')[0],
            remark: document.getElementById('remark').value,
            items: items
        };

        const res = await fetch('api/save_transfer.php', { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if(result.status === 'success') {
            Swal.fire('成功', '調撥單 ' + result.transfer_no + ' 已生效', 'success').then(()=>location.reload());
        } else {
            Swal.fire('錯誤', result.message, 'error');
        }
    }
</script>
</body>
</html>
