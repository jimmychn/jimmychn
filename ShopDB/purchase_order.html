<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進貨處理 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f0f4f1; }
        .table-input { border: none; background: transparent; width: 100%; }
        .table-input:focus { outline: none; border-bottom: 2px solid #198754; }
        .summary-box { background: #fff; border-left: 5px solid #198754; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-cart-flatbed text-success me-2"></i>進貨處理 (入庫)</h2>
        <div>
            <button class="btn btn-outline-secondary me-2" onclick="location.href='index.html'">回首頁</button>
            <button class="btn btn-success px-4 shadow-sm" onclick="savePurchase()">
                <i class="fa-solid fa-check-double"></i> 完成進貨存檔
            </button>
        </div>
    </div>

    <div class="row g-3">
        <!-- 單頭資訊 -->
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-body row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label small fw-bold">選擇供應商</label>
                        <select id="supplier_id" class="form-select"></select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label small fw-bold">進貨日期</label>
                        <input type="date" id="purchase_date" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label small fw-bold">進貨單號</label>
                        <input type="text" class="form-control bg-light" value="系統自動編號" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- 單身明細 -->
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white d-flex justify-content-between">
                    <span class="fw-bold">進貨明細</span>
                    <button class="btn btn-sm btn-success" onclick="addRow()"><i class="fa-solid fa-plus"></i> 增加品項</button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 40%">產品名稱 / 條碼</th>
                                    <th style="width: 15%" class="text-center">進貨數量</th>
                                    <th style="width: 15%" class="text-center">進貨單價 (成本)</th>
                                    <th style="width: 20%" class="text-end">小計</th>
                                    <th style="width: 10%"></th>
                                </tr>
                            </thead>
                            <tbody id="itemBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 結算 -->
        <div class="col-12">
            <div class="card shadow-sm border-0 summary-box">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div class="flex-grow-1 me-3">
                        <input type="text" id="remark" class="form-control border-0" placeholder="點擊輸入進貨備註 (如：發票號碼、司機姓名...)">
                    </div>
                    <div class="text-end" style="min-width: 200px;">
                        <span class="text-muted">進貨總額：</span>
                        <h3 class="text-success d-inline">NT$ <span id="totalDisplay">0</span></h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 產品選擇彈窗 (複用之前的 Modal，但 JS 邏輯微調) -->
<div class="modal fade" id="prodModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5>選擇進貨產品</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="text" id="prodSearch" class="form-control mb-3" placeholder="關鍵字搜尋..." onkeyup="searchProds()">
                <table class="table table-hover">
                    <thead><tr><th>條碼</th><th>品名</th><th>成本價</th><th>目前庫存</th><th>操作</th></tr></thead>
                    <tbody id="prodListBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
    const prodModal = new bootstrap.Modal(document.getElementById('prodModal'));
    let activeRow = null;

    window.onload = () => {
        document.getElementById('purchase_date').valueAsDate = new Date();
        loadSuppliers();
        addRow(); // 預設一行
    };

    // 1. 載入供應商
    async function loadSuppliers() {
        const res = await fetch('api/get_suppliers.php');
        const result = await res.json();
        const select = document.getElementById('supplier_id');
        select.innerHTML = result.data.map(s => `<option value="${s.id}">${s.supplier_name}</option>`).join('');
    }

    // 2. 明細行操作
    function addRow() {
        const tr = document.createElement('tr');
        tr.className = 'item-row';
        tr.innerHTML = `
            <td>
                <div class="input-group">
                    <input type="text" class="form-control table-input prod-name" placeholder="點擊右側搜尋" readonly>
                    <button class="btn btn-outline-success btn-sm" onclick="openProdSelector(this)"><i class="fa-solid fa-search"></i></button>
                </div>
                <input type="hidden" class="prod-id">
            </td>
            <td><input type="number" class="form-control table-input text-center qty" value="1" onchange="calc()"></td>
            <td><input type="number" class="form-control table-input text-center price" value="0" onchange="calc()"></td>
            <td class="text-end fw-bold pt-3"><span class="subtotal">0</span></td>
            <td class="text-center"><button class="btn btn-link text-danger" onclick="this.closest('tr').remove();calc()"><i class="fa-solid fa-trash"></i></button></td>
        `;
        document.getElementById('itemBody').appendChild(tr);
    }

    // 3. 產品選擇與「自動帶入進價」
    function openProdSelector(btn) {
        activeRow = btn.closest('tr');
        prodModal.show();
        searchProds();
    }

    async function searchProds() {
        const q = document.getElementById('prodSearch').value;
        const res = await fetch(`api/get_products.php?q=${encodeURIComponent(q)}`);
        const result = await res.json();
        document.getElementById('prodListBody').innerHTML = result.data.map(p => `
            <tr>
                <td>${p.sku}</td>
                <td>${p.name}</td>
                <td>$${p.purchase_price}</td>
                <td>${p.stock_qty}</td>
                <td><button class="btn btn-sm btn-success" onclick="selectProd(${p.id}, '${p.name}', ${p.purchase_price})">選擇</button></td>
            </tr>
        `).join('');
    }

    function selectProd(id, name, costPrice) {
        activeRow.querySelector('.prod-id').value = id;
        activeRow.querySelector('.prod-name').value = name;
        activeRow.querySelector('.price').value = costPrice; // 自動帶入進價
        prodModal.hide();
        calc();
    }

    function calc() {
        let total = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const q = parseFloat(row.querySelector('.qty').value) || 0;
            const p = parseFloat(row.querySelector('.price').value) || 0;
            const sub = q * p;
            row.querySelector('.subtotal').innerText = sub.toLocaleString();
            total += sub;
        });
        document.getElementById('totalDisplay').innerText = total.toLocaleString();
    }

    // 4. 儲存存檔
    async function savePurchase() {
        const items = [];
        document.querySelectorAll('.item-row').forEach(row => {
            const pid = row.querySelector('.prod-id').value;
            if(pid) {
                items.push({
                    product_id: pid,
                    qty: row.querySelector('.qty').value,
                    price: row.querySelector('.price').value
                });
            }
        });

        if(items.length === 0) return Swal.fire('提示', '請至少加入一項產品', 'warning');

        const payload = {
            supplier_id: document.getElementById('supplier_id').value,
            purchase_date: document.getElementById('purchase_date').value,
            remark: document.getElementById('remark').value,
            total_amount: document.getElementById('totalDisplay').innerText.replace(/,/g, ''),
            items: items
        };

        const res = await fetch('api/save_purchase.php', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.status === 'success') {
            Swal.fire('成功', '進貨單號：' + data.purchase_no, 'success').then(() => location.reload());
        }
    }
</script>
</body>
</html>
