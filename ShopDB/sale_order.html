<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷貨單據 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .table-input { border: none; background: transparent; width: 100%; }
        .table-input:focus { outline: none; border-bottom: 1px solid #0d6efd; }
        .order-summary { background: #f8f9fa; border-radius: 10px; padding: 20px; }
        /* 手機版：隱藏表格標頭，改用卡片感 */
        @media (max-width: 768px) {
            .hide-mobile { display: none; }
            .item-row { border: 1px solid #dee2e6; margin-bottom: 10px; padding: 10px; border-radius: 8px; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <!-- 功能按鈕列 (置頂) -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-outline-secondary" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> 回列表
        </button>
        <div>
            <button class="btn btn-primary shadow-sm" id="btnSave">
                <i class="fa-solid fa-floppy-disk"></i> 儲存單據
            </button>
            <button class="btn btn-info text-white shadow-sm auth-print" id="btnPrint">
                <i class="fa-solid fa-print"></i> 列印
            </button>
        </div>
    </div>

    <div class="row g-3">
        <!-- 1. 銷貨單頭 (Header) -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><strong><i class="fa-solid fa-file-invoice"></i> 基本資訊 (單頭)</strong></div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-6 col-md-3">
                            <label class="form-label small text-muted">銷貨單號</label>
                            <input type="text" class="form-control bg-light" value="SO20231027001" readonly>
                        </div>
                        <div class="col-6 col-md-3">
                            <label class="form-label small text-muted">單據日期</label>
                            <input type="date" class="form-control" id="order_date">
                        </div>
                        <!-- 修改原本的客戶選擇欄位 -->
						<div class="col-12 col-md-3">
							<label class="form-label small text-muted">選擇客戶</label>
							<select class="form-select" id="customer_id" onchange="updateCustomerInfo()">
								<option value="">-- 載入中... --</option>
							</select>
						</div>
						<!-- 隱藏欄位存地址，選中客戶自動帶入備註或地址 -->
						<input type="hidden" id="customer_address">
                        <div class="col-12 col-md-3">
                            <label class="form-label small text-muted">門市/倉庫</label>
                            <input type="text" class="form-control bg-light" value="台北總店" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 銷貨單身 (Detail / Items) -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <strong><i class="fa-solid fa-list"></i> 銷售明細 (單身)</strong>
                    <button class="btn btn-sm btn-success" onclick="addItem()"><i class="fa-solid fa-plus"></i> 新增品項</button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="itemTable">
                            <thead class="table-light hide-mobile">
                                <tr>
                                    <th style="width: 40%">產品名稱/條碼</th>
                                    <th style="width: 15%">數量</th>
                                    <th style="width: 15%">單價</th>
                                    <th style="width: 15%">小計</th>
                                    <th style="width: 10%">操作</th>
                                </tr>
                            </thead>
                            <tbody id="itemBody">
                                <!-- 預設第一行 -->
                                <tr class="item-row">
                                    <td>
                                        <div class="input-group">
                                            <input type="text" class="form-control table-input" placeholder="掃描或搜尋品名...">
                                            <button class="btn btn-outline-secondary btn-sm" onclick="openProductModal(this)">
												<i class="fa-solid fa-magnifying-glass"></i>
											</button>
                                        </div>
                                    </td>
                                    <td><input type="number" class="form-control table-input qty" value="1" onchange="calcTotal()"></td>
                                    <td><input type="number" class="form-control table-input price" value="0" onchange="calcTotal()"></td>
                                    <td><span class="subtotal">0</span></td>
                                    <td><button class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove();calcTotal();"><i class="fa-solid fa-trash"></i></button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 結算區 (Summary) -->
        <div class="col-12">
			<div class="order-summary shadow-sm p-3 mt-3 bg-white">
				<div class="row">
					<div class="col-md-7">
						<textarea class="form-control" rows="2" placeholder="單據備註..."></textarea>
					</div>
					<div class="col-md-5">
						<div class="d-flex justify-content-between mb-2">
							<span>合計金額：</span>
							<span id="subTotalDisplay">0</span>
						</div>
						<div class="d-flex justify-content-between align-items-center mb-2">
							<span>折扣金額：</span>
							<input type="number" id="discountInput" class="form-control form-control-sm w-50 text-end" value="0" onchange="calcFinal()">
						</div>
						<div class="d-flex justify-content-between border-top pt-2">
							<strong>應付總計：</strong>
							<h3 class="text-danger">NT$ <span id="finalAmountDisplay">0</span></h3>
						</div>
					</div>
				</div>
			</div>
        </div>
    </div>
</div>

<!-- 產品選擇彈窗 -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">選擇產品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- 搜尋框 -->
                <div class="input-group mb-3">
                    <input type="text" id="modalSearchInput" class="form-control" placeholder="輸入品名或條碼關鍵字...">
                    <button class="btn btn-primary" onclick="searchProducts()">搜尋</button>
                </div>
                <!-- 產品清單表格 -->
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>條碼</th>
                                <th>品名</th>
                                <th>庫存</th>
                                <th>單價</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="modalProductList">
                            <!-- 由 JS 動態產生 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
	let currentRow = null; // 用來記錄目前是哪一列點開了放大鏡

	// 1. 開啟彈窗並記錄目標行
	function openProductModal(btn) {
		currentRow = btn.closest('tr'); // 找到點擊按鈕所在的那一行
		const modal = new bootstrap.Modal(document.getElementById('productModal'));
		modal.show();
		searchProducts(); // 初始化載入
		alert('openProductModal');
	}

	// 2. 搜尋產品 API 呼叫
	async function searchProducts() {
		const q = document.getElementById('modalSearchInput').value;
		const response = await fetch(`api/get_products.php?q=${encodeURIComponent(q)}`);
		const products = await response.json();

		const list = document.getElementById('modalProductList');
		list.innerHTML = products.map(p => `
			<tr>
				<td>${p.sku}</td>
				<td>${p.name}</td>
				<td class="${p.stock_qty <= 0 ? 'text-danger' : ''}">${p.stock_qty}</td>
				<td>${p.price}</td>
				<td>
					<button class="btn btn-sm btn-outline-primary" 
						onclick="selectProduct(${p.id}, '${p.name}', ${p.price})">選擇</button>
				</td>
			</tr>
		`).join('');
	}

	// 3. 選中產品回填到單據行
	function selectProduct(id, name, price) {
		if (currentRow) {
			// 回填資訊到當前行
			currentRow.querySelector('input[type="text"]').value = name;
			currentRow.querySelector('.price').value = price;
			// 這裡可以考慮加一個隱藏欄位存 product_id
			currentRow.dataset.productId = id; 

			// 關閉彈窗
			const modalEl = document.getElementById('productModal');
			const modal = bootstrap.Modal.getInstance(modalEl);
			modal.hide();

			// 觸發金額計算
			calcTotal();
		}
	}

    // 模擬：新增一行單身
    function addItem() {
        const html = `
            <tr class="item-row">
                <td>
                    <div class="input-group">
                        <input type="text" class="form-control table-input" placeholder="產品名稱...">
						<!-- 修改後的按鈕範例 -->
						<button class="btn btn-outline-secondary btn-sm" onclick="openProductModal(this)">
							<i class="fa-solid fa-magnifying-glass"></i>
						</button>
                    </div>
                </td>
                <td><input type="number" class="form-control table-input qty" value="1" onchange="calcTotal()"></td>
                <td><input type="number" class="form-control table-input price" value="0" onchange="calcTotal()"></td>
                <td><span class="subtotal">0</span></td>
                <td><button class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove();calcTotal();"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`;
        document.getElementById('itemBody').insertAdjacentHTML('beforeend', html);
    }

    // 模擬：計算金額
    function calcTotal() {
        let total = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = row.querySelector('.qty').value || 0;
            const price = row.querySelector('.price').value || 0;
            const subtotal = qty * price;
            row.querySelector('.subtotal').innerText = subtotal.toLocaleString();
            total += subtotal;
        });
        document.getElementById('totalAmount').innerText = total.toLocaleString();
    }
	
	function calcFinal() {
		let subTotal = 0;
		document.querySelectorAll('.item-row').forEach(row => {
			const qty = parseFloat(row.querySelector('.qty').value) || 0;
			const price = parseFloat(row.querySelector('.price').value) || 0;
			subTotal += qty * price;
		});

		const discount = parseFloat(document.getElementById('discountInput').value) || 0;
		const final = subTotal - discount;

		document.getElementById('subTotalDisplay').innerText = subTotal.toLocaleString();
		document.getElementById('finalAmountDisplay').innerText = final.toLocaleString();
	}

    // 儲存事件
    document.getElementById('btnSave').onclick = function() {
        Swal.fire({
            title: '確定儲存單據？',
            text: "儲存後將扣除庫存並產生帳款",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '確定儲存',
            cancelButtonText: '取消'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire('成功', '銷貨單 SO20231027001 已完成儲存', 'success');
            }
        });
    };

	function saveData() {
		const orderData = {
			customer_id: document.getElementById('customer_id').value,
			order_date: document.getElementById('order_date').value,
			remark: document.querySelector('textarea').value,
			total_amount: document.getElementById('totalAmount').innerText.replace(/,/g, ''),
			items: [] // 這裡要遍歷表格抓取資料
		};

		// 範例：抓取第一行商品 (實務上請用迴圈抓取所有 .item-row)
		orderData.items.push({
			product_id: 1, // 假設已知產品 ID
			qty: 1,
			price: 100
		});

		fetch('api/save_order.php', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(orderData)
		})
		.then(res => res.json())
		.then(data => {
			if(data.status === 'success') Swal.fire('成功', '單號：' + data.order_no, 'success');
		});
	}
	// 1. 頁面初始化載入客戶清單
	async function loadCustomers() {
		const res = await fetch('api/get_customers.php');
		const customers = await res.json();
		
		const select = document.getElementById('customer_id');
		select.innerHTML = '<option value="">-- 請選擇客戶 --</option>';
		
		customers.forEach(c => {
			const opt = document.createElement('option');
			opt.value = c.id;
			opt.text = c.customer_name + (c.tel ? ' (' + c.tel + ')' : '');
			opt.dataset.address = c.address; // 將地址存在 dataset 裡
			select.appendChild(opt);
		});
	}

	// 2. 當客戶變動時，自動帶入相關資訊（例如地址到備註）
	function updateCustomerInfo() {
		const select = document.getElementById('customer_id');
		const selectedOption = select.options[select.selectedIndex];
		const address = selectedOption.dataset.address || '';
		
		if (address && address !== '無') {
			// 自動在備註提示送貨地址
			document.querySelector('textarea').value = "送貨地址：" + address;
		}
	}

	// 在 window.onload 執行
	window.onload = function() {
		loadCustomers();
	};

</script>
</body>
</html>
