<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調撥單據管理 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .status-1 { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; } /* 待收貨 */
        .status-2 { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; } /* 已結案 */
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-truck-ramp-box text-primary me-2"></i>門市調撥清單</h2>
        <a href="stock_transfer.html" class="btn btn-primary shadow-sm"><i class="fa-solid fa-plus"></i> 新增調撥</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>單號 / 日期</th>
                            <th>轉出門市 ➔ 轉入門市</th>
                            <th class="text-center">狀態</th>
                            <th class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="transferTableBody">
                        <!-- 資料由 JS 載入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
    let currentUser = null;

    window.onload = async () => {
        // 1. 取得目前登入者資訊 (確認所屬門市)
        const sessionRes = await fetch('api/check_session.php');
        const sessionData = await sessionRes.json();
        currentUser = sessionData.user;
        
        loadTransfers();
    };

    async function loadTransfers() {
        const res = await fetch('api/get_transfers.php');
        const result = await res.json();
        const tbody = document.getElementById('transferTableBody');

        if (result.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">暫無調撥紀錄</td></tr>';
            return;
        }

        tbody.innerHTML = result.data.map(t => {
            // 狀態標籤判斷
            const statusText = t.status == 1 ? '待收貨 (物流中)' : '已結案 (已入庫)';
            const statusClass = t.status == 1 ? 'status-1' : 'status-2';
            
            /**
             * 點收按鈕邏輯：
             * 1. 狀態必須為 1 (待收貨)
             * 2. 目前使用者所屬門市必須等於「轉入門市 (to_store_id)」
             */
            const canReceive = (t.status == 1 && currentUser.store_id === t.to_store_id);
            const actionBtn = canReceive 
                ? `<button class="btn btn-sm btn-success shadow-sm" onclick="receiveTransfer('${t.transfer_no}')">
                    <i class="fa-solid fa-box-open me-1"></i> 點收驗收
                   </button>`
                : `<button class="btn btn-sm btn-outline-secondary" onclick="viewDetail('${t.transfer_no}')">查看明細</button>`;

            return `
                <tr>
                    <td>
                        <div class="fw-bold">${t.transfer_no}</div>
                        <div class="small text-muted">${t.transfer_date}</div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border">${t.from_name}</span>
                        <i class="fa-solid fa-arrow-right mx-2 text-muted"></i>
                        <span class="badge bg-light text-dark border">${t.to_name}</span>
                    </td>
                    <td class="text-center">
                        <span class="badge ${statusClass} p-2">${statusText}</span>
                    </td>
                    <td class="text-center">${actionBtn}</td>
                </tr>
            `;
        }).join('');
    }

    async function receiveTransfer(no) {
        const confirm = await Swal.fire({
            title: '確認點收貨物？',
            text: "點收後庫存將正式加入您的門市，且單據無法修改。",
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: '確定入庫',
            cancelButtonText: '取消'
        });

        if (confirm.isConfirmed) {
            const res = await fetch('api/receive_transfer.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transfer_no: no })
            });
            const data = await res.json();
            if (data.status === 'success') {
                Swal.fire('成功', '商品已正式入庫', 'success');
                loadTransfers();
            } else {
                Swal.fire('錯誤', data.message, 'error');
            }
        }
    }

    function viewDetail(no) {
        Swal.fire('查看詳情', '單號：' + no + ' (功能開發中)', 'info');
    }
</script>
</body>
</html>
