<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進貨退回作業 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { background-color: #f0f4f1; }</style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-reply text-danger me-2"></i>進貨退回 (採購退出)</h2>
        <button class="btn btn-danger shadow-sm" onclick="saveReturn()"><i class="fa-solid fa-save"></i> 儲存退回單</button>
    </div>

    <!-- 搜尋原單 -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-bold">輸入原進貨單號</label>
                    <div class="input-group">
                        <input type="text" id="originPO" class="form-control" placeholder="POXXXXXXXX">
                        <button class="btn btn-success" onclick="fetchPODetails()">一鍵帶入明細</button>
                    </div>
                </div>
                <div class="col-md-6 text-end" id="supInfo"></div>
            </div>
        </div>
    </div>

    <!-- 明細編輯 -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead class="table-light">
                    <tr>
                        <th>產品名稱</th>
                        <th class="text-center">原進貨數</th>
                        <th class="text-center" style="width:120px">退回數</th>
                        <th class="text-end">單價</th>
                        <th class="text-end">小計</th>
                    </tr>
                </thead>
                <tbody id="itemBody">
                    <tr><td colspan="5" class="text-center py-4 text-muted">請先搜尋原進貨單號</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-end">
            <span class="text-muted">退款總計：</span>
            <h3 class="text-danger d-inline">NT$ <span id="totalDisplay">0</span></h3>
        </div>
    </div>
</div>

<script>
    let supplierId = null;

    async function fetchPODetails() {
        const no = document.getElementById('originPO').value;
        const res = await fetch(`api/get_purchase_details.php?no=${no}`); // 需另寫此 API
        const result = await res.json();
        if(result.status === 'error') return Swal.fire('錯誤', result.message, 'error');

        supplierId = result.data[0].supplier_id;
        document.getElementById('supInfo').innerHTML = `<span class="badge bg-success p-2">供應商：${result.data[0].supplier_name}</span>`;
        
        document.getElementById('itemBody').innerHTML = result.data.map(item => `
            <tr class="item-row" data-pid="${item.product_id}">
                <td>${item.product_name}</td>
                <td class="text-center">${item.qty}</td>
                <td><input type="number" class="form-control text-center ret-qty" value="${item.qty}" max="${item.qty}" onchange="calc()"></td>
                <td class="text-end price">${item.price}</td>
                <td class="text-end subtotal">${item.qty * item.price}</td>
            </tr>
        `).join('');
        calc();
    }

    function calc() {
        let total = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const q = row.querySelector('.ret-qty').value;
            const p = row.querySelector('.price').innerText;
            const sub = q * p;
            row.querySelector('.subtotal').innerText = sub.toLocaleString();
            total += sub;
        });
        document.getElementById('totalDisplay').innerText = total.toLocaleString();
    }

    async function saveReturn() {
        const items = [];
        document.querySelectorAll('.item-row').forEach(row => {
            items.push({
                product_id: row.dataset.pid,
                qty: row.querySelector('.ret-qty').value,
                price: row.querySelector('.price').innerText
            });
        });

        const payload = {
            origin_purchase_no: document.getElementById('originPO').value,
            supplier_id: supplierId,
            return_date: new Date().toISOString().split('T')[0],
            total_amount: document.getElementById('totalDisplay').innerText.replace(/,/g, ''),
            items: items
        };

        const res = await fetch('api/save_purchase_return.php', { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        if(data.status === 'success') {
            Swal.fire('成功', '退回單 ' + data.return_no + ' 已儲存，庫存已扣除', 'success').then(() => location.reload());
        }
    }
</script>
</body>
</html>
