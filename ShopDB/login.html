<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background: #f4f7f6; display: flex; align-items: center; height: 100vh; margin: 0; }
        .login-box { width: 100%; max-width: 400px; margin: auto; padding: 15px; }
        .card { border: none; border-radius: 15px; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="card shadow-lg">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-boxes-stacked fa-3x text-primary"></i>
                <h3 class="mt-2">進銷存管理</h3>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label"><i class="fa-solid fa-user me-2"></i>帳號</label>
                    <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="請輸入帳號" required>
                </div>
                <div class="mb-4">
                    <label class="form-label"><i class="fa-solid fa-lock me-2"></i>密碼</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="請輸入密碼" required>
                </div>
				<!-- 在密碼欄位後加入驗證碼 -->
				<div class="mb-3">
					<label class="form-label">圖文驗證碼</label>
					<div class="input-group">
						<input type="text" id="captcha" name="captcha" class="form-control" placeholder="請輸入右圖數字" required>
						<img src="api/captcha.php" id="captchaImg" onclick="this.src='api/captcha.php?'+Math.random()" style="cursor:pointer" title="點擊重新整理">
					</div>
				</div>
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                    登入系統 <i class="fa-solid fa-right-to-bracket ms-1"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // 1. 監聽表單提交事件：使用現代原生 fetch() 處理登入事件
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 阻止表單預設提交行為
/*//===================
		// 2. 自訂 loginForm 的 JSON 物件
        const userData = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
			captcha: document.getElementById('captcha').value // 補上這一行
        };
		
        // 3. 以 JSON 資料，呼叫後端 PHP API
        fetch('api/login_api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        })
/*///=================		
		// 2. 建立 FormData 物件，自動打包表單資料
		const formData = new FormData(this); 

		// 3. 使用 fetch 送出 POST 請求
		fetch('api/login_api.php', {
			method: 'POST',
			body: formData // 注意：不需要自己設定 Content-Type，瀏覽器會自動處理
		})
//*///================		
        .then(response => response.json())
        .then(data => {
            // 登入成功：使用 SweetAlert2 提示
			if (data.status === 'success') {
				Swal.fire({
					icon: 'success',
					title: '登入成功',
					text: '正在進入系統...',
					timer: 1500,
					showConfirmButton: false
				}).then(() => {
					location.href = 'index.html';
				});
			} else {
				// 這裡會顯示後端回傳的具體錯誤 (例如：驗證碼錯誤)
				throw new Error(data.message || '登入失敗');
			}        
		})
        .catch(error => {
			Swal.fire({
				icon: 'error',
				title: '登入失敗',
				text: error.message
			});
			// 登入失敗時自動重新整理驗證碼
			document.getElementById('captchaImg').click();        
		});
    });
</script>

</body>
</html>
