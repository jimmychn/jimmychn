<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供應商管理 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .is-inactive { background-color: #f1f1f1 !important; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-truck-field text-success me-2"></i>供應商管理</h2>
        <button class="btn btn-success shadow-sm" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> 新增供應商
        </button>
    </div>

    <!-- 搜尋與篩選 -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body d-flex gap-3">
            <div class="input-group flex-grow-1">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchInput" class="form-control" placeholder="搜尋供應商或電話..." onkeyup="loadSuppliers(1)">
            </div>
            <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" id="showInactive" onchange="loadSuppliers(1)">
                <label class="form-check-label small">顯示已停用</label>
            </div>
        </div>
    </div>

    <!-- 供應商列表 -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>供應商名稱</th>
                            <th>聯絡人</th>
                            <th>電話</th>
                            <th class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="supplierTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white text-end">
            <span class="text-muted small" id="paginationInfo"></span>
            <nav class="d-inline-block ms-3"><ul class="pagination pagination-sm mb-0" id="paginationBtns"></ul></nav>
        </div>
    </div>
</div>

<!-- 新增/修改 Modal -->
<div class="modal fade" id="supplierModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="supplierForm" class="modal-content border-0 shadow">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalTitle">供應商資料</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="supId">
                <div class="mb-3">
                    <label class="form-label">供應商全名 <span class="text-danger">*</span></label>
                    <input type="text" id="supName" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">聯絡窗口</label>
                        <input type="text" id="supContact" class="form-control">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">電話</label>
                        <input type="tel" id="supTel" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">地址</label>
                    <input type="text" id="supAddress" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-success">儲 存</button>
            </div>
        </form>
    </div>
</div>

<script>
    const modalObj = new bootstrap.Modal(document.getElementById('supplierModal'));
    
    window.onload = () => loadSuppliers(1);

    async function loadSuppliers(page = 1) {
        const q = document.getElementById('searchInput').value;
        const showInactive = document.getElementById('showInactive').checked;
        const res = await fetch(`api/get_suppliers.php?q=${encodeURIComponent(q)}&page=${page}&show_inactive=${showInactive}`);
        const result = await res.json();

        const tbody = document.getElementById('supplierTableBody');
        tbody.innerHTML = result.data.map(s => `
            <tr class="${s.is_active == 0 ? 'is-inactive text-muted' : ''}">
                <td><strong>${s.supplier_name}</strong> ${s.is_active == 0 ? '<span class="badge bg-secondary ms-1">已停用</span>' : ''}</td>
                <td>${s.contact_person || '-'}</td>
                <td>${s.tel || '-'}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${JSON.stringify(s).replace(/"/g, '&quot;')})"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-sm btn-outline-${s.is_active == 1 ? 'danger' : 'success'}" onclick="updateStatus(${s.id}, ${s.is_active == 1 ? 0 : 1})">
                        <i class="fa-solid fa-${s.is_active == 1 ? 'trash' : 'rotate-left'}"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function openModal() {
        document.getElementById('supplierForm').reset();
        document.getElementById('supId').value = '';
        document.getElementById('modalTitle').innerText = '新增供應商';
        modalObj.show();
    }

    function openEdit(s) {
        document.getElementById('modalTitle').innerText = '修改供應商';
        document.getElementById('supId').value = s.id;
        document.getElementById('supName').value = s.supplier_name;
        document.getElementById('supContact').value = s.contact_person;
        document.getElementById('supTel').value = s.tel;
        document.getElementById('supAddress').value = s.address;
        modalObj.show();
    }

    document.getElementById('supplierForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            id: document.getElementById('supId').value,
            supplier_name: document.getElementById('supName').value,
            contact_person: document.getElementById('supContact').value,
            tel: document.getElementById('supTel').value,
            address: document.getElementById('supAddress').value
        };
        await fetch('api/save_supplier.php', { method: 'POST', body: JSON.stringify(payload) });
        modalObj.hide();
        loadSuppliers(1);
    };

    async function updateStatus(id, status) {
        await fetch('api/update_supplier_status.php', { method: 'POST', body: JSON.stringify({ id, status }) });
        loadSuppliers(1);
    }
</script>
</body>
</html>
