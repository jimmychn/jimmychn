<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門市據點管理 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { background-color: #f4f7f6; }</style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-store text-primary me-2"></i>門市據點管理</h2>
        <button class="btn btn-primary shadow-sm" onclick="addStoreModal()">
            <i class="fa-solid fa-plus"></i> 新增門市
        </button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>門市代號</th>
                        <th>門市名稱</th>
                        <th>電話</th>
                        <th>地址</th>
                        <th class="text-center">狀態</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="storeTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 門市編輯 Modal -->
<div class="modal fade" id="storeModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="storeForm" class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">門市資料維護</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">門市代號</label>
                    <input type="text" id="storeId" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">門市名稱</label>
                    <input type="text" id="storeName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">門市總部</label>
                    <input type="text" id="storeHead" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">聯絡電話</label>
                    <input type="text" id="storeTel" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">門市地址</label>
                    <input type="text" id="storeAddr" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary w-100">儲存門市資訊</button>
            </div>
        </form>
    </div>
</div>

<script>
    const storeModal = new bootstrap.Modal(document.getElementById('storeModal'));

    window.onload = loadStores;

    async function loadStores() {
        const res = await fetch('api/get_system_data.php?type=stores');
        const data = await res.json();
        document.getElementById('storeTableBody').innerHTML = data.map(s => `
            <tr>
                <td>${s.store_id}</td>
                <td class="fw-bold">${s.store_name}</td>
                <td>${s.tel || '-'}</td>
                <td>${s.address || '-'}</td>
                <td class="text-center">
                    <span class="badge ${s.is_active == 1 ? 'bg-success' : 'bg-secondary'}">
                        ${s.is_active == 1 ? '營運中' : '已關閉'}
                    </span>
                </td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-secondary" onclick='editStore(${JSON.stringify(s)})'>
                        <i class="fa-solid fa-pen"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function addStoreModal() {
        document.getElementById('storeForm').reset();
        document.getElementById('storeId').value = '';
		document.getElementById('storeId').readOnly = false;
        storeModal.show();
    }

    function editStore(s) {
        document.getElementById('storeId').value = s.store_id;
        document.getElementById('storeName').value = s.store_name;
        document.getElementById('storeHead').value = s.store_head;
        document.getElementById('storeTel').value = s.tel;
        document.getElementById('storeAddr').value = s.address;
		document.getElementById('storeId').readOnly = true;
        storeModal.show();
    }

    document.getElementById('storeForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            store_id: document.getElementById('storeId').value,
            store_name: document.getElementById('storeName').value,
			store_head: document.getElementById('storeHead').value,
            tel: document.getElementById('storeTel').value,
            address: document.getElementById('storeAddr').value
        };
        const res = await fetch('api/save_store.php', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if(result.status === 'success') {
            storeModal.hide();
            Swal.fire('成功', '門市資料已更新', 'success');
            loadStores();
        }
    };
</script>
</body>
</html>
