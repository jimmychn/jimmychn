<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶對帳報表 - 進銷存系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        /* 列印模式優化：隱藏導航與按鈕，強制背景白色 */
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .container { max-width: 100%; width: 100%; margin: 0; }
            .card { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- 1. 篩選工具列 (列印時不顯示) -->
    <div class="card shadow-sm mb-4 border-0 no-print">
        <div class="card-body">
            <h5 class="mb-3"><i class="fa-solid fa-calculator text-primary me-2"></i>應收帳款對帳查詢</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small">目標客戶</label>
                    <select id="customer_id" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">起日</label>
                    <input type="date" id="date_start" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">迄日</label>
                    <input type="date" id="date_end" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="queryStatement()">
                        <i class="fa-solid fa-search"></i> 查詢
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 報表主體內容 -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold">應收帳款對帳單 (AR Statement)</h3>
                <p class="text-muted small">列印時間：<span id="printTime"></span></p>
            </div>

            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr class="text-center">
                        <th>交易日期</th>
                        <th>類型</th>
                        <th>單據號碼</th>
                        <th class="text-end">交易金額</th>
                        <th>備註內容</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr><td colspan="5" class="text-center py-5 text-muted">請輸入條件後點擊查詢</td></tr>
                </tbody>
                <tfoot>
                    <tr class="table-primary h5">
                        <td colspan="3" class="text-end fw-bold">本期應收帳款合計：</td>
                        <td class="text-end fw-bold text-primary" id="totalBalance">$ 0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>

            <!-- 簽核區 (僅列印時顯得專業) -->
            <div class="mt-5 d-flex justify-content-between px-5 d-none d-print-flex">
                <div class="border-top border-dark pt-1 px-4">會計覆核</div>
                <div class="border-top border-dark pt-1 px-4">負責人</div>
                <div class="border-top border-dark pt-1 px-4">客戶簽認</div>
            </div>

            <div class="mt-4 text-end no-print">
                <button class="btn btn-outline-dark" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> 列印催款單
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // 初始化日期與客戶選單
    window.onload = async () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date_start').value = today.substring(0, 8) + '01';
        document.getElementById('date_end').value = today;
        document.getElementById('printTime').innerText = new Date().toLocaleString();

        // 載入客戶列表 API
        const res = await fetch('api/get_customers.php');
        const json = await res.json();
        const select = document.getElementById('customer_id');
        select.innerHTML = '<option value="">-- 請選擇客戶 --</option>' + 
            json.data.map(c => `<option value="${c.id}">${c.customer_name}</option>`).join('');
    };

    // 核心查詢函式
    async function queryStatement() {
        const cid = document.getElementById('customer_id').value;
        const ds = document.getElementById('date_start').value;
        const de = document.getElementById('date_end').value;

        if(!cid) return alert('請選擇客戶');

        const res = await fetch(`api/get_customer_statement.php?customer_id=${cid}&date_start=${ds}&date_end=${de}`);
        const result = await res.json();

        if(result.status === 'success') {
            const tbody = document.getElementById('resultBody');
            if(result.details.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">此期間無交易往來</td></tr>';
            } else {
                tbody.innerHTML = result.details.map(row => `
                    <tr>
                        <td class="text-center">${row.doc_date}</td>
                        <td class="text-center">
                            <span class="badge ${row.type==='銷貨' ? 'bg-primary' : 'bg-danger'}">${row.type}</span>
                        </td>
                        <td class="text-center fw-bold">${row.doc_no}</td>
                        <td class="text-end ${row.amount < 0 ? 'text-danger fw-bold' : ''}">
                            ${parseFloat(row.amount).toLocaleString()}
                        </td>
                        <td class="small text-muted">${row.remark || ''}</td>
                    </tr>
                `).join('');
            }
            document.getElementById('totalBalance').innerText = '$ ' + parseFloat(result.balance).toLocaleString();
        }
    }
</script>
</body>
</html>
